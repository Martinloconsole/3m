name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Personalizar iconos, splash y permisos
        run: |
          pip install pillow
          python native/patch_android.py

      - name: Copiar la web y los plugins al proyecto
        run: npx cap sync android

      - name: Firma estable (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 3M.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: 3M-apk
          path: 3M.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" 3M.apk \
            --title "3M · build ${{ github.run_number }}" \
            --notes "APK de 3M compilado desde el commit ${GITHUB_SHA::7}. Descárgalo e instálalo en Android." \
            --latest
